name: CI/CD Pipeline - Medical Insurance Cost Prediction

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-train-deploy:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # fetch full history for DVC comparison

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install dvc[s3]  # or dvc[dagshub] if you use DagsHub

    - name: Pull latest DVC data
      run: |
        dvc pull || echo "No DVC data to pull"

    - name: Check for data changes
      id: dvc_status
      run: |
        if dvc status | grep -q "changed data"; then
          echo "data_changed=true" >> $GITHUB_ENV
        else
          echo "data_changed=false" >> $GITHUB_ENV
        fi

    - name: Retrain model if data changed
      if: env.data_changed == 'true'
      run: |
        echo "🚀 Data changed — retraining model..."
        python main.py
        dvc add artifact/model.pkl
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git add artifact/model.pkl.dvc
        git commit -m "Auto retrained model"
        dvc push

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/medical-insurance-cost-prediction:latest .

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/medical-insurance-cost-prediction:latest

    - name: Deploy to Render
      run: |
        curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
