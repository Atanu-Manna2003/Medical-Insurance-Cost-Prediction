stages:
  data_ingestion:
    cmd: python -m src.components.data_ingestion
    deps:
      - src/components/data_ingestion.py
      - notebook/data/insurance.csv
    outs:
      - artifact/train.csv
      - artifact/test.csv
      - artifact/data.csv

  data_transformation:
    cmd: python -m src.components.data_transformation
    deps:
      - src/components/data_transformation.py
      - artifact/train.csv
      - artifact/test.csv
    outs:
      - artifact/preprocessor.pkl

  model_trainer:
    cmd: python -m main
    deps:
      - main.py
      - src/components/model_trainer.py
      - artifact/preprocessor.pkl
      - artifact/train.csv
      - artifact/test.csv
    outs:
      - artifact/model.pkl
    metrics:
      - artifact/metrics.json
